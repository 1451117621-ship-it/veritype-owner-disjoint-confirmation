<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}.title{font-size:23px;font-weight:700}.sub{font-size:14px;fill:#52616b}.axis{font-size:13px;fill:#52616b}.row{font-size:15px}.value{font-size:13px;font-weight:700}</style>
<text x="55" y="42" class="title">Owner-disjoint confirmation: accuracy and fallback cost</text>
<text x="55" y="67" class="sub">188 owners; 3,760 machine-validated Java type-recovery targets; observed raw-ledger bundle</text>
<line x1="300.0" y1="125" x2="300.0" y2="490" stroke="#d9e2e7" stroke-width="1"/>
<text x="300.0" y="525" text-anchor="middle" class="axis">60%</text>
<line x1="450.0" y1="125" x2="450.0" y2="490" stroke="#d9e2e7" stroke-width="1"/>
<text x="450.0" y="525" text-anchor="middle" class="axis">65%</text>
<line x1="600.0" y1="125" x2="600.0" y2="490" stroke="#d9e2e7" stroke-width="1"/>
<text x="600.0" y="525" text-anchor="middle" class="axis">70%</text>
<line x1="750.0" y1="125" x2="750.0" y2="490" stroke="#d9e2e7" stroke-width="1"/>
<text x="750.0" y="525" text-anchor="middle" class="axis">75%</text>
<line x1="900.0" y1="125" x2="900.0" y2="490" stroke="#d9e2e7" stroke-width="1"/>
<text x="900.0" y="525" text-anchor="middle" class="axis">80%</text>
<line x1="1050.0" y1="125" x2="1050.0" y2="490" stroke="#d9e2e7" stroke-width="1"/>
<text x="1050.0" y="525" text-anchor="middle" class="axis">85%</text>
<line x1="300" y1="490" x2="1050" y2="490" stroke="#52616b" stroke-width="1.5"/>
<text x="675.0" y="548" text-anchor="middle" class="axis">Exact-recovery accuracy</text>
<text x="282" y="162" text-anchor="end" class="row">Always primary model</text>
<line x1="300" y1="157" x2="343.2" y2="157" stroke="#566573" stroke-width="5" stroke-linecap="round"/>
<circle cx="343.2" cy="157" r="8" fill="#566573"/>
<text x="357.2" y="162" class="value">61.44% | $0.00</text>
<text x="282" y="212" text-anchor="end" class="row">Always fallback model</text>
<line x1="300" y1="207" x2="825.0" y2="207" stroke="#a93226" stroke-width="5" stroke-linecap="round"/>
<circle cx="825.0" cy="207" r="8" fill="#a93226"/>
<text x="839.0" y="212" class="value">77.50% | $74.50</text>
<text x="282" y="262" text-anchor="end" class="row">Unusable-only escalation</text>
<line x1="300" y1="257" x2="900.0" y2="257" stroke="#ca6f1e" stroke-width="5" stroke-linecap="round"/>
<circle cx="900.0" cy="257" r="8" fill="#ca6f1e"/>
<text x="914.0" y="262" class="value">80.00% | $27.10</text>
<text x="282" y="312" text-anchor="end" class="row">Confidence-only</text>
<line x1="300" y1="307" x2="960.0" y2="307" stroke="#2874a6" stroke-width="5" stroke-linecap="round"/>
<circle cx="960.0" cy="307" r="8" fill="#2874a6"/>
<text x="974.0" y="312" class="value">82.00% | $47.82</text>
<text x="282" y="362" text-anchor="end" class="row">Hash-random baseline</text>
<line x1="300" y1="357" x2="971.7" y2="357" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round"/>
<circle cx="971.7" cy="357" r="8" fill="#7f8c8d"/>
<text x="985.7" y="362" class="value">82.39% | $47.84</text>
<text x="282" y="412" text-anchor="end" class="row">Structure-aware (primary)</text>
<line x1="300" y1="407" x2="1011.0" y2="407" stroke="#117a65" stroke-width="5" stroke-linecap="round"/>
<circle cx="1011.0" cy="407" r="8" fill="#117a65"/>
<text x="1025.0" y="412" class="value">83.70% | $47.86</text>
<text x="282" y="462" text-anchor="end" class="row">Full-feature ablation</text>
<line x1="300" y1="457" x2="1007.7" y2="457" stroke="#8e44ad" stroke-width="5" stroke-linecap="round"/>
<circle cx="1007.7" cy="457" r="8" fill="#8e44ad"/>
<text x="1021.7" y="462" class="value">83.59% | $47.91</text>
<text x="55" y="520" class="sub">Labels show accuracy | incremental fallback cost. Cost is the observed recorded route cost, not a current price quote.</text>
</svg>